<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us | Blooming Oasis</title>
    <link rel="stylesheet" href="css/style.css">
    <!-- Bootstrap for Framework requirement -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        .contact-container {
            max-width: 800px;
            margin: 4rem auto;
            background: white;
            padding: 3rem;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.05);
        }
        .form-group {
            margin-bottom: 1.5rem;
        }
        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 600;
        }
        .form-control {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-family: inherit;
        }
        textarea.form-control {
            height: 150px;
        }
    </style>
</head>
<body>

    <nav>
        <a href="index.html" class="logo">Blooming Oasis</a>
        <div class="menu-toggle" id="mobile-menu">
            <span></span>
            <span></span>
            <span></span>
        </div>
        <ul class="nav-links">
            <li><a href="index.html">Home</a></li>
            <li><a href="product.html">Products</a></li>
            <li><a href="about.html">About Us</a></li>
            <li><a href="contact.html">Contact</a></li>
            <li>
                <a href="#" id="cart-icon" style="position: relative;">
                    <i class="fas fa-shopping-cart"></i>
                    <span id="cart-count" style="position: absolute; top: -10px; right: -10px; background: var(--accent-color); color: white; border-radius: 50%; padding: 2px 6px; font-size: 0.7rem; display: none;">0</span>
                </a>
            </li>
        </ul>
    </nav>

    <div class="container">
        <h1 class="section-title">Get in Touch</h1>
        <p style="text-align: center; margin-bottom: 3rem;">Have a question about plant care or an order? We're here to help!</p>

        <div class="contact-container">
            <form id="contact-form">
                <div class="form-group">
                    <label for="name">Name</label>
                    <input type="text" id="name" class="form-control" required placeholder="Your full name">
                </div>
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" class="form-control" required placeholder="Your email address">
                </div>
                <div class="form-group">
                    <label for="message">Message</label>
                    <textarea id="message" class="form-control" required placeholder="How can we help?"></textarea>
                </div>
                <button type="submit" class="btn btn-primary" style="width: 100%;">Send Message</button>
            </form>
        </div>
    </div>

    <!-- Confirmation Popup -->
    <div id="confirmation-modal" class="modal">
        <div class="modal-content">
            <div style="font-size: 4rem; color: var(--secondary-color); margin-bottom: 1rem;">✔</div>
            <h2>Message Received!</h2>
            <p style="margin: 1rem 0;">Thank you for reaching out. We'll get back to you within 24 hours.</p>
            <button class="btn btn-primary" onclick="closeModal()">Close</button>
        </div>
    </div>

    <footer>
        <div class="footer-bottom">
            <p id="footer-date-time"></p>
        </div>
    </footer>

    <!-- Cart Drawer -->
    <div class="cart-overlay" id="cart-overlay"></div>
    <div class="cart-drawer" id="cart-drawer">
        <div class="cart-header">
            <h3>Your Cart</h3>
            <span class="close-cart" id="close-cart">&times;</span>
        </div>
        <div class="cart-items" id="cart-items-container">
            <!-- Items will be injected by JS -->
            <p style="text-align: center; color: #666; margin-top: 2rem;">Your cart is empty.</p>
        </div>
        <div class="cart-footer">
            <div class="cart-total">
                <span>Total</span>
                <span id="cart-total-amount">$0.00</span>
            </div>
            <button class="btn btn-primary" style="width: 100%;">Checkout Now</button>
        </div>
    </div>

    <script src="js/script.js"></script>
</body>
</html>
