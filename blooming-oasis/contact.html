<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us | Blooming Oasis</title>
    <link rel="stylesheet" href="style.css">
</head>
<body style="padding-top: 80px;">
    <nav>
        <div class="logo">BLOOMING OASIS</div>
        <div class="menu-toggle" id="mobile-menu">
            <span></span>
            <span></span>
            <span></span>
        </div>
        <div class="nav-links">
            <a href="index.html">Home</a>
            <a href="product.html">Monstera</a>
            <a href="about.html">About Us</a>
            <a href="contact.html">Contact</a>
        </div>
    </nav>

    <section>
        <div class="container" style="max-width: 800px;">
            <div style="text-align: center; margin-bottom: 50px;">
                <h1 style="font-size: 3rem; color: var(--primary); margin-bottom: 10px;">Get in Touch</h1>
                <p>Have a question about plant care or an order? We're here to help.</p>
            </div>

            <div style="background: var(--white); padding: 40px; border-radius: 20px; box-shadow: var(--shadow);">
                <form id="contact-form">
                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 20px;">
                        <div>
                            <label style="display: block; margin-bottom: 8px; font-weight: 600;">First Name</label>
                            <input type="text" required style="width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 8px;">
                        </div>
                        <div>
                            <label style="display: block; margin-bottom: 8px; font-weight: 600;">Last Name</label>
                            <input type="text" required style="width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 8px;">
                        </div>
                    </div>
                    <div style="margin-bottom: 20px;">
                        <label style="display: block; margin-bottom: 8px; font-weight: 600;">Email Address</label>
                        <input type="email" required style="width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 8px;">
                    </div>
                    <div style="margin-bottom: 20px;">
                        <label style="display: block; margin-bottom: 8px; font-weight: 600;">Message</label>
                        <textarea required rows="5" style="width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 8px;"></textarea>
                    </div>
                    <button type="submit" class="btn" style="width: 100%; padding: 15px;">Send Message</button>
                </form>
            </div>
        </div>
    </section>

    <!-- Success Popup -->
    <div id="success-popup" class="popup-overlay">
        <div class="popup-content">
            <div style="font-size: 4rem; color: var(--secondary); margin-bottom: 20px;">✓</div>
            <h2 style="color: var(--primary); margin-bottom: 15px;">Message Sent!</h2>
            <p style="margin-bottom: 30px;">Thank you for reaching out. A plant expert will get back to you within 24 hours.</p>
            <button class="btn" onclick="closePopup()">Close Window</button>
        </div>
    </div>

    <footer>
        <div class="container">
            <div class="logo" style="margin-bottom: 20px;">BLOOMING OASIS</div>
            <div class="footer-bottom">
                <p id="current-time"></p>
                <p>&copy; 2026 Blooming Oasis. All rights reserved.</p>
            </div>
        </div>
    </footer>

    <script src="main.js"></script>
</body>
</html>
